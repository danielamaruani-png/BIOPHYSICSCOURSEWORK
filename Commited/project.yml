name: Commited
options:
  bundleIdPrefix: com.commitedapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  Commited:
    type: application
    platform: iOS
    sources:
      - path: Commited
        excludes:
          - "**/*.entitlements"
    resources:
      - path: Commited/Resources
    entitlements:
      path: Commited/Commited.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.commitedapp.shared
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    info:
      path: Commited/Info.plist
      properties:
        CFBundleDisplayName: Commited
        UILaunchScreen: {}
        NSCameraUsageDescription: "Commited uses your camera to capture today's proof photo. Commited is a live-camera-only app — no photo library import is offered, so this is the only way to post."
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.REPLACE_WITH_REVERSED_CLIENT_ID"
          - CFBundleURLSchemes:
              # Lets the widget's "post proof" button deep-link straight
              # into that crew's capture sheet (commited://capture?crewId=...)
              # instead of just opening the app on whatever screen it was
              # left on.
              - "commited"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: CommitedWidgetExtension
        embed: true
    postCompileScripts: []

  CommitedWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CommitedWidget
    entitlements:
      path: CommitedWidget/CommitedWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.commitedapp.shared
    info:
      path: CommitedWidget/Info.plist
      properties:
        CFBundleDisplayName: Commited Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
