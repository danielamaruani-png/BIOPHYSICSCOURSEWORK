name: iOS build check

# Compiles the Commited app in the cloud on every push that touches it —
# no Mac needed on your end at all. This is a compile-only,
# unsigned build against the simulator SDK: it exists purely to catch
# Swift errors, since this codebase has never been built locally
# (written without Xcode access). It does NOT sign, run tests, or
# publish anywhere — see the README's "Path to the App Store" section
# for the separate signed/TestFlight pipeline once you have an Apple
# Developer account.

on:
  push:
    branches: ["**"]
    paths:
      - "Commited/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: Commited

    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for the simulator (unsigned, compile-only)
        run: |
          xcodebuild build \
            -project Commited.xcodeproj \
            -scheme Commited \
            -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
