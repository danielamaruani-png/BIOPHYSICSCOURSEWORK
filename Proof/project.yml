name: Proof
options:
  bundleIdPrefix: com.proofapp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # fill in your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  Proof:
    type: application
    platform: iOS
    sources:
      - path: Proof
        excludes:
          - "**/*.entitlements"
    resources:
      - path: Proof/Resources
    entitlements:
      path: Proof/Proof.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.proofapp.shared
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    info:
      path: Proof/Info.plist
      properties:
        CFBundleDisplayName: Proof
        UILaunchScreen: {}
        NSCameraUsageDescription: "Proof uses your camera to capture today's proof photo. Proof is a live-camera-only app — no photo library import is offered, so this is the only way to post."
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - "com.googleusercontent.apps.53305321410-88v547baka2hs86li6d6gkrn1g4tcd0a"
          - CFBundleURLSchemes:
              # Lets the widget's "post proof" button deep-link straight
              # into that crew's capture sheet (proof://capture?crewId=...)
              # instead of just opening the app on whatever screen it was
              # left on.
              - "proof"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ProofWidgetExtension
        embed: true
    postCompileScripts: []

  ProofWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ProofWidget
    entitlements:
      path: ProofWidget/ProofWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.proofapp.shared
    info:
      path: ProofWidget/Info.plist
      properties:
        CFBundleDisplayName: Proof Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
